<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chefão Coletivo</title></head>
<body><canvas id="c"></canvas>
<script src="common.js"></script>
<script>
// ============ CONFIGURAÇÃO (mude aqui) ============
const CONFIG = {
  bossHpBase: 400,        // vida do 1º chefão
  bossHpGrowth: 1.45,     // quanto a vida cresce a cada chefão
  commentDamage: 1,       // dano de cada comentário
  commentCooldownMs: 900, // um mesmo usuário só ataca a cada X ms
  likeDamage: 0.2,        // dano por curtida (0 desliga)
  giftDamagePerCoin: 3,   // dano por moeda de presente
  stompEverySec: 5,       // de quanto em quanto tempo o chefão pisa
  stunSec: 4,             // tempo que uma fruta fica atordoada
  maxHeroes: 60,          // máximo de frutas na tela
};
const BOSSES = [
  { name: 'Rei Gosma', color: '#5be37a', eye: '#fff' },
  { name: 'Lord Preguiça', color: '#b78cff', eye: '#ffe14d' },
  { name: 'Titã do Trânsito', color: '#ff9a3c', eye: '#fff' },
  { name: 'Mestre Fantasma', color: '#7fd7ff', eye: '#ff4d6d' },
  { name: 'Dragão de Lava', color: '#ff5a4d', eye: '#ffe14d' },
];
// ==================================================
const heroes = new Map(), shots = [], beams = [];
let dmgByUser = new Map(), totalDmg = new Map();
let level = 0, boss = null, stompT = 0, victory = null;

function newBoss() {
  const def = BOSSES[level % BOSSES.length];
  const max = Math.round(CONFIG.bossHpBase * Math.pow(CONFIG.bossHpGrowth, level));
  boss = { ...def, hp: max, max, x: W / 2, y: 330, t: 0, hurt: 0, dead: false, n: level + 1 };
  dmgByUser = new Map(); stompT = CONFIG.stompEverySec;
}
newBoss();

function getHero(user, nick) {
  let h = heroes.get(user);
  if (!h) {
    if (heroes.size >= CONFIG.maxHeroes) {
      let old = null; for (const x of heroes.values()) if (!old || x.last < old.last) old = x;
      if (old) heroes.delete(old.user);
    }
    h = { user, nick, x: rand(40, W - 40), y: rand(650, 890), tx: 0, ty: 0, fruit: fruitFor(user), last: 0, stun: 0, t: rand(0, 6), atk: 0 };
    h.tx = h.x; h.ty = h.y; heroes.set(user, h);
  }
  h.nick = nick || h.nick; return h;
}
function addDamage(user, nick, dmg) {
  if (boss.dead) return;
  boss.hp -= dmg; boss.hurt = 0.15;
  dmgByUser.set(user, (dmgByUser.get(user) || 0) + dmg);
  const t = totalDmg.get(user) || { nick, dmg: 0 }; t.dmg += dmg; t.nick = nick; totalDmg.set(user, t);
  if (boss.hp <= 0) killBoss();
}
function beam(x, color) { beams.push({ x, color, life: 0.35, max: 0.35 }); burst(x, boss.y, color, 18, 300); }

function onChat({ user, nick }) {
  const h = getHero(user, nick), now = performance.now();
  if (h.stun > 0 || now - h.last < CONFIG.commentCooldownMs) return;
  h.last = now; h.atk = 0.3;
  shots.push({ x: h.x, y: h.y - 20, user, nick, dmg: CONFIG.commentDamage, color: h.fruit.body, big: false });
  beep(520 + Math.random() * 200, 0.05, 'square', 0.02);
}
function onLike({ user, nick, count }) {
  if (!CONFIG.likeDamage) return;
  const h = getHero(user, nick); if (h.stun > 0) return;
  addDamage(user, nick, CONFIG.likeDamage * Math.min(count, 15));
}
function onGift({ user, nick, name, coins }) {
  const h = getHero(user, nick); h.stun = 0; h.atk = 0.8;
  const dmg = Math.round(coins * CONFIG.giftDamagePerCoin), tier = tierOf(coins);
  addBanner(`${nick} mandou ${name}!`, `${dmg} de dano`, tier);
  if (tier === 0) shots.push({ x: h.x, y: h.y - 20, user, nick, dmg, color: '#ff7aa8', big: true });
  else if (tier === 1) for (let i = 0; i < 6; i++) setTimeout(() => shots.push({ x: h.x, y: h.y - 20, user, nick, dmg: dmg / 6, color: '#ffd24d', big: true }), i * 80);
  else if (tier === 2) setTimeout(() => { FX.flash = 0.5; FX.shake = 14; addDamage(user, nick, dmg); beam(h.x, '#4dd2ff'); }, 250);
  else if (tier === 3) setTimeout(() => { FX.flash = 0.8; FX.shake = 24; addDamage(user, nick, dmg); beam(h.x, '#ff4d6d'); beam(W / 2, '#ff4d6d'); }, 300);
  else for (let i = 0; i < 14; i++) setTimeout(() => { FX.flash = 0.4; FX.shake = 18; addDamage(user, nick, dmg / 14); const x = rand(60, W - 60); beam(x, '#c06bff'); }, 250 + i * 140);
  beep(300 + tier * 150, 0.25, 'sawtooth', 0.05, 400);
}
function killBoss() {
  boss.dead = true;
  const ranking = [...dmgByUser.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u, d]) => ({ nick: (totalDmg.get(u) || {}).nick || u, dmg: Math.round(d) }));
  victory = { name: boss.name, ranking };
  burst(boss.x, boss.y, boss.color, 70, 420); FX.shake = 30; FX.flash = 1; beep(200, 0.6, 'sawtooth', 0.07, -120);
  setTimeout(() => { level += 1; victory = null; newBoss(); }, 5000);
}

function update(dt) {
  boss.t += dt; boss.hurt = Math.max(0, boss.hurt - dt);
  boss.x = W / 2 + Math.sin(boss.t * 0.8) * 90; boss.y = 330 + Math.sin(boss.t * 1.6) * 14;
  if (!boss.dead) {
    stompT -= dt;
    if (stompT <= 0) {
      stompT = CONFIG.stompEverySec; FX.shake = 16; beep(90, 0.3, 'sawtooth', 0.08, -40);
      const list = [...heroes.values()], n = Math.max(1, Math.ceil(list.length * 0.25));
      for (let i = 0; i < n && list.length; i++) { const h = list.splice(Math.floor(Math.random() * list.length), 1)[0]; h.stun = CONFIG.stunSec; burst(h.x, h.y, '#fff', 8, 120); }
      floatText(boss.x, boss.y + 150, 'PISÃO!', '#ffe14d', 34, 0.9);
    }
  }
  for (const h of heroes.values()) {
    h.t += dt; h.stun = Math.max(0, h.stun - dt); h.atk = Math.max(0, h.atk - dt);
    if (Math.hypot(h.tx - h.x, h.ty - h.y) < 4) { h.tx = rand(30, W - 30); h.ty = rand(650, 890); }
    const d = Math.hypot(h.tx - h.x, h.ty - h.y) || 1, sp = h.stun > 0 ? 0 : 20;
    h.x += (h.tx - h.x) / d * sp * dt; h.y += (h.ty - h.y) / d * sp * dt;
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i], dx = boss.x - s.x, dy = boss.y - s.y, d = Math.hypot(dx, dy) || 1, sp = s.big ? 700 : 560;
    s.x += dx / d * sp * dt; s.y += dy / d * sp * dt;
    if (boss.dead) shots.splice(i, 1);
    else if (d < 40) { addDamage(s.user, s.nick, s.dmg); if (s.big) floatText(s.x, s.y - 10, '-' + Math.round(s.dmg), '#ffd24d', 24, 0.7); burst(s.x, s.y, s.color, 5, 120); shots.splice(i, 1); }
  }
  for (let i = beams.length - 1; i >= 0; i--) { beams[i].life -= dt; if (beams[i].life <= 0) beams.splice(i, 1); }
}

function drawBoss() {
  const b = boss; if (b.dead) return;
  const sq = 1 + Math.sin(b.t * 3) * 0.04;
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1 / sq, sq);
  ctx.fillStyle = '#0006'; ctx.beginPath(); ctx.ellipse(0, 130, 120, 22, 0, 0, 7); ctx.fill();
  ctx.fillStyle = b.hurt > 0 ? '#fff' : b.color; ctx.beginPath(); ctx.ellipse(0, 0, 130, 120, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(0, 60, 110, 55, 0, 0, Math.PI); ctx.fill();
  for (const ex of [-45, 45]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, -25, 30, 0, 7); ctx.fill();
    ctx.fillStyle = b.eye === '#fff' ? '#222' : b.eye; ctx.beginPath(); ctx.arc(ex + Math.sin(b.t * 2) * 8, -22, 14, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = '#222'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-70, -70); ctx.lineTo(-20, -55); ctx.moveTo(70, -70); ctx.lineTo(20, -55); ctx.stroke();
  ctx.fillStyle = '#220'; ctx.beginPath(); ctx.roundRect(-55, 35, 110, 45 + Math.sin(b.t * 5) * 6, 18); ctx.fill();
  ctx.fillStyle = '#fff'; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 20 - 8, 35); ctx.lineTo(i * 20 + 8, 35); ctx.lineTo(i * 20, 52); ctx.fill(); }
  ctx.restore();
}

function draw() {
  beginFrame();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#241a4d'); g.addColorStop(0.55, '#3a2a78'); g.addColorStop(1, '#16102e');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#ffffff10'; for (let i = 0; i < 30; i++) { ctx.beginPath(); ctx.arc((i * 97) % W, (i * 53) % 560, 1.5 + (i % 3), 0, 7); ctx.fill(); }
  ctx.fillStyle = '#1d1540'; ctx.fillRect(-20, 600, W + 40, H);
  for (const f of beams) { ctx.globalAlpha = f.life / f.max; ctx.fillStyle = f.color; ctx.fillRect(f.x - 26, 0, 52, 650); ctx.fillStyle = '#fff'; ctx.fillRect(f.x - 9, 0, 18, 650); ctx.globalAlpha = 1; }
  drawBoss();
  [...heroes.values()].sort((a, b) => a.y - b.y).forEach((h) => {
    ctx.globalAlpha = h.stun > 0 ? 0.5 : 1;
    ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 24, 14, 5, 0, 0, 7); ctx.fill();
    drawFruit(h.x, h.y, h.fruit, { s: 0.8, t: h.t, bob: Math.sin(h.t * 4) * 1.5, arm: h.atk > 0, stun: h.stun > 0, look: 0 });
    ctx.globalAlpha = 1;
    txt(h.nick.slice(0, 10), h.x, h.y + 42, 12, '#fff');
  });
  for (const s of shots) { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, s.big ? 10 : 5, 0, 7); ctx.fill(); }
  endFrame();
  // HUD
  txt(`CHEFÃO ${boss.n}: ${boss.name.toUpperCase()}`, W / 2, 56, 28);
  rr(30, 82, W - 60, 34, 17); ctx.fillStyle = '#000a'; ctx.fill();
  const pct = Math.max(0, boss.hp / boss.max);
  rr(34, 86, Math.max(0, (W - 68) * pct), 26, 13); ctx.fillStyle = pct > 0.5 ? '#4ddc6a' : pct > 0.2 ? '#ffc933' : '#ff4d4d'; ctx.fill();
  txt(`${Math.max(0, Math.ceil(boss.hp))} / ${boss.max}`, W / 2, 99, 18);
  txt('COMENTE PARA ATACAR  ·  PRESENTE = SUPER GOLPE', W / 2, 140, 17, '#ffe14d');
  const top = [...dmgByUser.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (top.length) {
    rr(14, 160, 190, 34 + top.length * 26, 12); ctx.fillStyle = '#0008'; ctx.fill();
    txt('MAIORES DANOS', 109, 176, 14, '#ffe14d', 'center', false);
    top.forEach(([u, d], i) => txt(`${i + 1}. ${((totalDmg.get(u) || {}).nick || u).slice(0, 9)}  ${Math.round(d)}`, 26, 204 + i * 26, 16, '#fff', 'left', false));
  }
  if (victory) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    txt('CHEFÃO DERROTADO!', W / 2, 300, 40, '#ffe14d'); txt(victory.name, W / 2, 350, 26);
    victory.ranking.forEach((r, i) => txt(`${i + 1}º  ${r.nick}  ${r.dmg}`, W / 2, 430 + i * 50, 28));
    txt('Próximo chefão vem mais forte...', W / 2, 640, 20, '#ffe14d');
  }
}
startLive({ onChat, onGift, onLike, demoTexts: ['atacar', 'bora', 'vai', 'forte'] });
runGame(update, draw);
</script></body></html>
