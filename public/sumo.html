<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arena Sumô de Robôs</title></head>
<body><canvas id="c"></canvas>
<script src="common.js"></script>
<script>
// ============ CONFIGURAÇÃO ============
const CONFIG = {
  maxFighters: 24,
  minFighters: 6,           // completa com robôs-bot para a arena nunca ficar vazia
  dashImpulse: 380,
  commentCooldownMs: 450,
  radiusStart: 230, radiusMin: 110, shrinkSec: 70,
  restartAfterSec: 6,
};
// ======================================
const CX = W / 2, CY = 520, fighters = new Map();
let R = CONFIG.radiusStart, roundT = 0, winner = null, endT = 0, round = 1, wins = new Map(), T = 0, botN = 0;

function spawn(f) { const a = rand(0, 7), d = rand(30, R - 50); f.x = CX + Math.cos(a) * d; f.y = CY + Math.sin(a) * d; f.vx = f.vy = 0; f.out = false; f.shield = 0; f.big = 0; f.cd = 0; }
function getFighter(user, nick, bot = false) {
  let f = fighters.get(user);
  if (!f) {
    const real = [...fighters.values()].filter((x) => !x.bot);
    if (!bot && real.length >= CONFIG.maxFighters) { let old = null; for (const q of real) if (!old || q.last < old.last) old = q; fighters.delete(old.user); }
    f = { user, nick, bot, robot: robotFor(user), last: 0, t: rand(0, 6), botT: rand(1, 3), cheer: 0, kills: 0 }; spawn(f); fighters.set(user, f);
  }
  f.nick = nick || f.nick; return f;
}
function ensureBots() {
  const real = [...fighters.values()].filter((x) => !x.bot).length;
  const bots = [...fighters.values()].filter((x) => x.bot);
  const want = Math.max(0, CONFIG.minFighters - real);
  while (bots.length < want) { const n = ++botN; bots.push(getFighter('bot' + n, 'Bot ' + n, true)); }
  while (bots.length > want) { const b = bots.pop(); fighters.delete(b.user); }
}
function nearestFoe(f) { let best = null, bd = 1e9; for (const o of fighters.values()) if (o !== f && !o.out) { const d = Math.hypot(o.x - f.x, o.y - f.y); if (d < bd) { bd = d; best = o; } } return best; }
function dash(f, mult = 1) {
  const foe = nearestFoe(f); if (!foe) return;
  const d = Math.hypot(foe.x - f.x, foe.y - f.y) || 1;
  f.vx += (foe.x - f.x) / d * CONFIG.dashImpulse * mult; f.vy += (foe.y - f.y) / d * CONFIG.dashImpulse * mult; f.cheer = 0.3;
}
function onChat({ user, nick }) {
  const f = getFighter(user, nick), now = performance.now(); f.last = now;
  if (winner || f.out || now - f.cd < CONFIG.commentCooldownMs) return;
  f.cd = now; dash(f); beep(260, 0.06, 'square', 0.03, 120);
}
function onLike() {}
function onGift({ user, nick, name, coins }) {
  const f = getFighter(user, nick), tier = tierOf(coins); if (winner) return;
  if (f.out) spawn(f);
  addBanner(`${nick} mandou ${name}!`, ['ESCUDO!', 'SUPER INVESTIDA!', 'ONDA DE CHOQUE!', 'ROBÔ GIGANTE!', 'CHUVA DE METEOROS!'][tier], tier);
  f.cheer = 1.5;
  if (tier === 0) f.shield = 6;
  else if (tier === 1) { f.shield = 4; for (let i = 0; i < 3; i++) setTimeout(() => dash(f, 1.6), i * 250); }
  else if (tier === 2) { FX.shake = 18; FX.flash = 0.5; for (const o of fighters.values()) if (o !== f && !o.out) { const d = Math.hypot(o.x - f.x, o.y - f.y) || 1; o.vx += (o.x - f.x) / d * 520; o.vy += (o.y - f.y) / d * 520; } burst(f.x, f.y, '#4dd2ff', 40, 340); }
  else if (tier === 3) { f.big = 12; f.shield = 12; FX.shake = 14; }
  else { FX.flash = 0.9; FX.shake = 26; const foes = [...fighters.values()].filter((o) => o !== f && !o.out).sort(() => Math.random() - 0.5).slice(0, 5); foes.forEach((o, i) => setTimeout(() => { o.vx += rand(-700, 700); o.vy += rand(-700, 700); burst(o.x, o.y, '#ff9a2e', 20, 300); }, i * 200)); }
  beep(300 + tier * 140, 0.25, 'sawtooth', 0.05, 400);
}
function update(dt) {
  T += dt; ensureBots();
  for (const f of fighters.values()) { f.t += dt; f.cheer = Math.max(0, f.cheer - dt); f.shield = Math.max(0, f.shield - dt); f.big = Math.max(0, f.big - dt); }
  if (winner) { endT -= dt; if (endT <= 0) { winner = null; round++; roundT = 0; R = CONFIG.radiusStart; for (const f of fighters.values()) spawn(f); } return; }
  roundT += dt; R = Math.max(CONFIG.radiusMin, CONFIG.radiusStart - (CONFIG.radiusStart - CONFIG.radiusMin) * (roundT / CONFIG.shrinkSec));
  const list = [...fighters.values()].filter((f) => !f.out);
  for (const f of list) {
    if (f.bot) { f.botT -= dt; if (f.botT <= 0) { f.botT = rand(1.2, 3); dash(f, 0.8); } }
    f.x += f.vx * dt; f.y += f.vy * dt; const fr = Math.exp(-2.2 * dt); f.vx *= fr; f.vy *= fr;
  }
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j], ra = (a.big > 0 ? 38 : 22), rb = (b.big > 0 ? 38 : 22), dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    if (d < ra + rb) {
      const nx = dx / d, ny = dy / d, ma = (a.shield > 0 ? 3 : 1) * (a.big > 0 ? 3 : 1), mb = (b.shield > 0 ? 3 : 1) * (b.big > 0 ? 3 : 1), ov = ra + rb - d;
      a.x -= nx * ov * mb / (ma + mb); a.y -= ny * ov * mb / (ma + mb); b.x += nx * ov * ma / (ma + mb); b.y += ny * ov * ma / (ma + mb);
      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rel < 0) { const imp = -(1.6) * rel / (1 / ma + 1 / mb); a.vx -= imp * nx / ma; a.vy -= imp * ny / ma; b.vx += imp * nx / mb; b.vy += imp * ny / mb; beep(120, 0.04, 'square', 0.02); burst((a.x + b.x) / 2, (a.y + b.y) / 2, '#fff', 3, 100); a.lastHit = b; b.lastHit = a; }
    }
  }
  for (const f of list) if (Math.hypot(f.x - CX, f.y - CY) > R + 10) {
    f.out = true; FX.shake = 8; burst(f.x, f.y, '#fff', 14, 200); beep(180, 0.2, 'sawtooth', 0.05, -90);
    if (f.lastHit && !f.lastHit.out) f.lastHit.kills++;
    floatText(clamp(f.x, 40, W - 40), clamp(f.y, 200, 800), `${f.nick.slice(0, 8)} caiu!`, '#ff9a9a', 18, 1.1);
  }
  const alive = [...fighters.values()].filter((f) => !f.out);
  if (alive.length <= 1 && fighters.size > 1) {
    const w = alive[0]; winner = w || { nick: 'Ninguém', robot: ROBOTS[0] }; endT = CONFIG.restartAfterSec;
    if (w && !w.bot) { const c = wins.get(w.user) || { nick: w.nick, n: 0 }; c.n++; c.nick = w.nick; wins.set(w.user, c); }
    burst(CX, CY, '#ffd24d', 80, 450); FX.flash = 0.7; FX.shake = 20; beep(500, 0.5, 'triangle', 0.07, 400);
  }
}
function draw() {
  beginFrame();
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a1a4a'); g.addColorStop(1, '#0e0820');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#ff4d1a'; ctx.globalAlpha = 0.35 + Math.sin(T * 3) * 0.1; ctx.beginPath(); ctx.arc(CX, CY, CONFIG.radiusStart + 60, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#5a6272'; ctx.beginPath(); ctx.arc(CX, CY, R + 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#8b94a6'; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ffffff40'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, R * 0.5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(CX, CY, R - 6, 0, 7); ctx.stroke();
  const list = [...fighters.values()].filter((f) => !f.out).sort((a, b) => a.y - b.y);
  for (const f of list) {
    const sc = f.big > 0 ? 1.5 : 0.85;
    ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(f.x, f.y + 26 * sc, 18 * sc, 6 * sc, 0, 0, 7); ctx.fill();
    drawRobot(f.x, f.y, f.robot, { s: sc, t: f.t, walk: Math.hypot(f.vx, f.vy) > 30, arm: f.cheer > 0, flip: f.vx < 0 });
    if (f.shield > 0) { ctx.strokeStyle = '#7fe9ff'; ctx.lineWidth = 3; ctx.globalAlpha = 0.6 + Math.sin(T * 8) * 0.2; ctx.beginPath(); ctx.arc(f.x, f.y - 2, 34 * sc, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    txt(f.nick.slice(0, 8), f.x, f.y + 38 * sc, 11, f.bot ? '#bbb' : '#fff');
  }
  endFrame();
  txt('ARENA SUMÔ DE ROBÔS', W / 2, 46, 30);
  txt('COMENTE PARA INVESTIR  ·  PRESENTE = ESCUDO, ONDA, GIGANTE', W / 2, 80, 14, '#fff6b0');
  txt(`RODADA ${round}  ·  ${list.length} robôs em pé`, W / 2, 110, 18, '#ffe14d');
  const w = [...wins.values()].sort((a, b) => b.n - a.n).slice(0, 3);
  if (w.length) {
    rr(VL, 135, 165, 28 + w.length * 22, 12); ctx.fillStyle = '#0008'; ctx.fill();
    txt('VITÓRIAS', VL + 82, 149, 13, '#ffe14d', 'center', false);
    w.forEach((x, i) => txt(`${i + 1}. ${x.nick.slice(0, 8)}  ${x.n}`, VL + 10, 171 + i * 22, 14, '#fff', 'left', false));
  }
  if (winner) {
    ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
    txt('CAMPEÃO DA ARENA!', W / 2, 320, 38, '#ffe14d');
    drawRobot(W / 2, 450, winner.robot, { s: 2.8, t: T, arm: true });
    txt(winner.nick, W / 2, 570, 34);
    txt('Próxima rodada já já...', W / 2, 700, 18, '#ffe14d');
  }
}
startLive({ onChat, onGift, onLike, demoTexts: ['vai', 'empurra', 'bora', 'forca'] });
runGame(update, draw);
</script></body></html>
